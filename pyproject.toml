[project]
name = "lento_convertpdf"
version = "1.0.0"
description = "Batch convert sheet music PDFs into MusicXML using homr, with a full GUI and open-source VST MusicXML preview player."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest", "music21", "verovio", "pyinstaller"]
practice = ["numpy", "scipy", "librosa>=0.10", "soundfile"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lento_convertpdf*", "lento_core*", "lento_practice*", "lento_library*"]

[project.scripts]
Lento_ConvertPDF = "lento_convertpdf.cli:main"
lento-practice = "lento_practice.cli:main"
lento-library = "lento_library.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "tests/convertpdf", "tests/practice"]
testpaths = ["tests"]
markers = ["homr_gpu: runs the real homr on the GPU (slow)"]
