name: Android

# Builds the Lento APK: a Trusted Web Activity that opens https://danmosier.github.io/Lento/ full screen in Chrome.
# The web app itself updates through GitHub Pages as before; this APK only needs rebuilding when android/ changes.
# Download: the "android-latest" release (from main) or "android-preview" (from other branches).
#
# Signing: set repository secrets ANDROID_KEYSTORE_BASE64 (base64 of a .keystore with alias "lento") and
# ANDROID_KEYSTORE_PASSWORD (its store and key password). Without them each build is signed with a throwaway key:
# it installs fine, but a later build can't install over it (uninstall first), and Chrome shows a URL bar because
# the site can't vouch for a key that keeps changing. See android/README.md.

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - name: Generate the Android project
        run: node generate.mjs ${{ github.run_number }}
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lento.keystore"
            PW="$KEYSTORE_PW"
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/lento.keystore" -alias lento -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Lento preview"
            echo "SIGNING=throwaway key (no ANDROID_KEYSTORE_BASE64 secret yet)" >> "$GITHUB_ENV"
            echo "::warning::Signed with a throwaway key. Add the ANDROID_KEYSTORE_* secrets (android/README.md)."
          fi
          echo "KS_PW=$PW" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/lento.keystore" -storepass "$PW" -alias lento | sed -n 's/.*SHA256: *//p')
          mkdir -p build/out
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"io.github.danmosier.lento","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" > build/out/assetlinks.json
          cat build/out/assetlinks.json
      - name: Build the APK
        working-directory: android/build/project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 build/project/app/build/outputs/apk/release/app-release-unsigned.apk build/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/lento.keystore" --ks-key-alias lento \
            --ks-pass env:KS_PW --key-pass env:KS_PW --out build/out/Lento.apk build/aligned.apk
          "$BT/apksigner" verify build/out/Lento.apk
          ls -la build/out
      - uses: actions/upload-artifact@v4
        with:
          name: lento-apk
          path: android/build/out/
      - name: Publish to a release (direct download link for the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TAG=android-latest; TITLE="Lento for Android"; PRE=""; else TAG=android-preview; TITLE="Lento for Android (preview)"; PRE="--prerelease"; fi
          NOTES="Built from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}), version 1.0.${GITHUB_RUN_NUMBER}. Signed with ${SIGNING}. On the phone or tablet: download Lento.apk, open it, and allow installing from this source if Android asks."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/out/Lento.apk build/out/assetlinks.json --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" $PRE
